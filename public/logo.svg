<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="16" in="SourceGraphic" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="magGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="m1"/>
      <feMerge>
        <feMergeNode in="m1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="laserGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- magenta accent stroke under the wordmark -->
  <path d="M640 236 Q400 262 160 236" fill="none" stroke="#E879F9" stroke-width="4" stroke-linecap="round" opacity="0.7" filter="url(#magGlow)"/>

  <!-- laser trail from the pixel ship -->
  <rect x="128" y="58" width="120" height="5" rx="2.5" fill="url(#laserGrad)" opacity="0.85"/>

  <!-- pixel spaceship decorating the first letter (rightmost in RTL) -->
  <g filter="url(#cyanGlow)">
    <g fill="#22D3EE">
      <rect x="96" y="52" width="8" height="8"/>
      <rect x="88" y="60" width="24" height="8"/>
      <rect x="80" y="68" width="40" height="8"/>
      <rect x="72" y="76" width="16" height="8"/>
      <rect x="112" y="76" width="16" height="8"/>
    </g>
    <rect x="94" y="62" width="12" height="6" fill="#E879F9" filter="url(#magGlow)"/>
    <rect x="92" y="84" width="6" height="10" fill="#FBBF24" opacity="0.9"/>
    <rect x="102" y="84" width="6" height="10" fill="#FBBF24" opacity="0.9"/>
  </g>

  <!-- wordmark -->
  <g filter="url(#cyanGlow)">
    <text x="430" y="200" text-anchor="middle"
          font-family="Cairo, 'Tajawal', sans-serif" font-weight="900" font-size="120"
          fill="#0A0F1E" stroke="#22D3EE" stroke-width="2.5"
          style="paint-order: stroke fill;">مدفع الفضاء</text>
  </g>
  <text x="430" y="200" text-anchor="middle"
        font-family="Cairo, 'Tajawal', sans-serif" font-weight="900" font-size="120"
        fill="#E8ECF8" opacity="0.92">مدفع الفضاء</text>
</svg>
